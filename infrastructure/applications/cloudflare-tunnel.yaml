apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflare-tunnel
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "22"
spec:
  project: default
  source:
    repoURL: https://github.com/mrgb7/home-lab.git
    targetRevision: HEAD
    path: infrastructure/additional-resources/cloudflare-tunnel
  destination:
    server: https://kubernetes.default.svc
    namespace: cloud-flare
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
