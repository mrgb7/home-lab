apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://charts.longhorn.io
      chart: longhorn
      targetRevision: 1.11.1
      helm:
        valueFiles:
          - $values/infrastructure/values/longhorn/values.yaml
    - repoURL: https://github.com/mrgb7/home-lab.git
      targetRevision: HEAD
      ref: values
    - repoURL: https://github.com/mrgb7/home-lab.git
      targetRevision: HEAD
      path: infrastructure/additional-resources/longhorn
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
