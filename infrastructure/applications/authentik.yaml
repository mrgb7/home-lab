apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: default
  sources:
    - repoURL: https://charts.goauthentik.io
      chart: authentik
      targetRevision: 2026.2.2
      helm:
        valueFiles:
          - $values/infrastructure/values/authentik/values.yaml
    - repoURL: https://github.com/mrgb7/home-lab.git
      targetRevision: HEAD
      ref: values
    - repoURL: https://github.com/mrgb7/home-lab.git
      targetRevision: HEAD
      path: infrastructure/additional-resources/authentik
  destination:
    server: https://kubernetes.default.svc
    namespace: authentik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
