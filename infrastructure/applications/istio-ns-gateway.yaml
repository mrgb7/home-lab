apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-ns-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "13"
spec:
  project: default
  sources:
    - repoURL: https://istio-release.storage.googleapis.com/charts
      chart: gateway
      targetRevision: 1.29.1
      helm:
        valueFiles:
          - $values/infrastructure/values/istio/gateway-values.yaml
    - repoURL: https://github.com/mrgb7/home-lab.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
