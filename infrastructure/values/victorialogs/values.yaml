vlselect:
  enabled: true
  replicaCount: 2
  extraArgs:
    envflag.enable: true
    loggerFormat: json
    httpListenAddr: :9471
    http.shutdownDelay: 15s
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  podSecurityContext:
    enabled: true
    fsGroup: 1000
  securityContext:
    enabled: true
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000

vlinsert:
  enabled: true
  replicaCount: 2
  extraArgs:
    envflag.enable: true
    loggerFormat: json
    httpListenAddr: :9481
    http.shutdownDelay: 15s
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  podSecurityContext:
    enabled: true
    fsGroup: 1000
  securityContext:
    enabled: true
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000

vlstorage:
  enabled: true
  replicaCount: 2
  retentionPeriod: "30d"
  extraArgs:
    envflag.enable: true
    loggerFormat: json
    httpListenAddr: :9491
    http.shutdownDelay: 15s
  persistentVolume:
    enabled: true
    accessModes:
      - ReadWriteOnce
    storageClassName: longhorn
    size: 30Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  podSecurityContext:
    enabled: true
    fsGroup: 1000
  securityContext:
    enabled: true
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000

vmauth:
  enabled: false

vector:
  enabled: false
