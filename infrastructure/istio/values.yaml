meshConfig:
  enableTracing: true
  accessLogFile: /dev/stdout
  defaultConfig:
    tracing:
      sampling: 100
  extensionProviders:
  - name: otel-tracing
    otel:
      service: opentelemetry-collector.observability.svc.cluster.local
      port: 4317

telemetry:
  enabled: true
  v2:
    enabled: true
    prometheus:
      enabled: true
