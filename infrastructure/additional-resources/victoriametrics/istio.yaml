  namespace: istio-system
spec:
  secretName: grafana-tls
  issuerRef:
    name: le-prod
    kind: ClusterIssuer
  dnsNames:
  - grafana.srelab.org
---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: grafana-gateway
  namespace: istio-system
spec:
  selector:
    istio: ns-gateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "grafana.srelab.org"
    tls:
      httpsRedirect: true
  - port:
      number: 443
      name: https
      protocol: HTTPS
    hosts:
    - "grafana.srelab.org"
    tls:
      mode: SIMPLE
      credentialName: grafana-tls
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
