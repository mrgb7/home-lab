## --- VMAlert ---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vmalert-cert
  namespace: istio-system
spec:
  secretName: vmalert-tls
  issuerRef:
    name: le-prod
    kind: ClusterIssuer
  dnsNames:
  - vmalert.srelab.org
---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: vmalert-gateway
  namespace: istio-system
spec:
  selector:
    istio: ns-gateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "vmalert.srelab.org"
    tls:
      httpsRedirect: true
  - port:
      number: 443
      name: https
      protocol: HTTPS
    hosts:
    - "vmalert.srelab.org"
    tls:
      mode: SIMPLE
      credentialName: vmalert-tls
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: vmalert-routing
  namespace: victoria-metrics
spec:
  hosts:
  - "vmalert.srelab.org"
  gateways:
  - istio-system/vmalert-gateway
  http:
  - route:
    - destination:
        host: vmalert-victoria-metrics.victoria-metrics.svc.cluster.local
        port:
          number: 8080
---
## --- Grafana ---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
